<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <header></header>
    <main>
        <section class="container">
            <div class="row mt-3 g-3">
                <div class="col">
                    <div class="card">
                        <div class="card-body">
                            <h3 class="card-title">CALCOLA IL PREZZO DEL TUO BIGLIETTO</h3>
                            <form class="row g-3">
                                <div class="col">
                                    <label for="fullName" class="form-label">Nome e Cognome</label>
                                    <input type="text" class="form-control" id="fullName">
                                </div>
                                <div class="col">
                                    <label for="distance" class="form-label">Km da percorrere</label>
                                    <input type="number" class="form-control" id="distance">
                                </div>
                                <div class="col">
                                    <label for="age" class="form-label">State</label>
                                    <select id="age" class="form-select">
                                        <option selected disabled>Seleziona...</option>
                                        <option>Minorenne</option>
                                        <option>Maggiorenne</option>
                                        <option>Over 65</option>
                                    </select>
                                </div>
                        </div>
                        <div class="col-12 d-flex justify-content-center">
                            <button type="submit" class="btn btn-outline-success">Sign in</button>
                            <button type="reset" class="btn btn-outline-secondary">Sign in</button>
                        </div>
                        </form>
                    </div>
                </div>
            </div>
            </div>
            <div class="col">
                <div class="card">
                    <div class="card-body row">
                        <h3 class="card-title">IL TUO BIGLIETTO</h3>
                        <div class="col-4">
                            <h4>DETTAGLIO PASSEGERI</h4>
                            <span>NOME PASSEGGERO</span>
                        </div>
                        <div class="col-8">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Offerta</th>
                                        <th>Carrozza</th>
                                        <th>Codice CP</th>
                                        <th>Costo Biglietto</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </section>
    </main>
    <footer></footer>
    <script src="./js/script.js"></script>
</body>

</html>
