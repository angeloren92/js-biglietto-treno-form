<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- header -->
    <header></header>
    <!-- main -->
    <main>
        <!-- container -->
        <section class="container">
            <!-- row ticketing -->
            <div class="row mt-3 g-3">
                <!-- col ticketing -->
                <div class="col-12">
                    <!-- card ticketing -->
                    <div class="card">
                        <div class="card-body">
                            <!-- title card ticketing -->
                            <h3 class="card-title">CALCOLA IL PREZZO DEL TUO BIGLIETTO</h3>
                            <!-- form card ticketing -->
                            <form class="row g-3">
                                <!-- input name -->
                                <div class="col">
                                    <label for="fullName" class="form-label">Nome e Cognome</label>
                                    <input type="text" class="form-control" id="fullName">
                                </div>
                                <!-- input distance -->
                                <div class="col">
                                    <label for="distance" class="form-label">Km da percorrere</label>
                                    <input type="number" class="form-control" id="distance">
                                </div>
                                <!-- input age -->
                                <div class="col">
                                    <label for="age" class="form-label">State</label>
                                    <select id="age" class="form-select">
                                        <option selected disabled>Seleziona...</option>
                                        <option>Minorenne</option>
                                        <option>Maggiorenne</option>
                                        <option>Over 65</option>
                                    </select>
                                </div>
                                <!-- submit and reset buttons  -->
                                <div class="col-12 d-flex justify-content-center">
                                    <button type="submit" class="btn btn-outline-success">Calcola</button>
                                    <button type="reset" class="btn btn-outline-secondary">Annulla</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <!-- col ticket -->
                <div class="col-12">
                    <!-- card ticket -->
                    <div class="card">
                        <div class="card-body row">
                            <!-- card title -->
                            <h3 class="card-title">IL TUO BIGLIETTO</h3>
                            <!-- ticket name details -->
                            <div class="col-4">
                                <small>DETTAGLIO PASSEGERI</small>
                                <h4 class="passenger">NOME PASSEGGERO</h4>
                            </div>
                            <div class="col-8">
                            <!-- ticket train detail and cost -->
                                <table class="table">
                                    <!-- header table -->
                                    <thead>
                                        <tr>
                                            <th>Offerta</th>
                                            <th>Carrozza</th>
                                            <th>Codice CP</th>
                                            <th>Costo Biglietto</th>
                                        </tr>
                                    </thead>
                                    <!-- body table -->
                                    <tbody>
                                        <tr>
                                            <td>1</td>
                                            <td>2</td>
                                            <td>3</td>
                                            <td>4</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- footer -->
    <footer></footer>

    <script src="./js/script.js"></script>
</body>

</html>
