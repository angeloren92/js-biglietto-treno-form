<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinazione Paradiso</title>
    <!-- link bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-warning">
    <!-- header -->
    <header>
        <!-- navbar -->
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Benvenuti a China-EXPRESS/中国铁路</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll"
                    aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!-- nav items -->
                <div class="collapse navbar-collapse" id="navbarScroll">
                    <ul class="navbar-nav me-auto my-2 my-lg-0 navbar-nav-scroll" style="--bs-scroll-height: 100px;">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">首页</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">车票</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">退票</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">会员</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">服务中心</a>
                        </li>
                    </ul>
                    <!-- search form -->
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                        <button class="btn btn-outline-success" type="">查</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>
    <!-- main -->
    <main>
        <!-- container -->
        <section class="container">
            <!-- row ticketing -->
            <div class="row mt-3 g-3">
                <!-- col ticketing -->
                <div class="col-12">
                    <!-- card ticketing -->
                    <div class="card">
                        <div class="card-body">
                            <!-- title card ticketing -->
                            <h3 class="card-title text-center mb-3">CALCOLA IL PREZZO DEL TUO BIGLIETTO</h3>
                            <!-- form card ticketing -->
                            <form id="mainForm" class="row g-3">
                                <!-- input name -->
                                <div class="col-12 col-md-4">
                                    <label for="fullName" class="form-label">Nome e Cognome</label>
                                    <input type="text" class="form-control" id="fullName">
                                </div>
                                <!-- input distance -->
                                <div class="col-12 col-md-4">
                                    <label for="distance" class="form-label">Km da percorrere</label>
                                    <input type="number" class="form-control" id="distance">
                                </div>
                                <!-- input age -->
                                <div class="col-12 col-md-4">
                                    <label for="age" class="form-label">Fascia Età</label>
                                    <select id="age" class="form-select">
                                        <option selected disabled>Seleziona...</option>
                                        <option>Minorenne</option>
                                        <option>Maggiorenne</option>
                                        <option>Over 65</option>
                                    </select>
                                </div>
                                <!-- submit and reset buttons  -->
                                <div class="col-12 d-flex justify-content-center gap-5">
                                    <button type="submit" class="btn btn-outline-success">Calcola</button>
                                    <button type="reset" class="btn btn-outline-secondary">Annulla</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <!-- col ticket -->
                <div id="ticket" class="col-12 d-none">
                    <!-- card ticket -->
                    <div class="card">
                        <div class="card-body row">
                            <!-- card title -->
                            <h3 class="card-title text-center mb-3">IL TUO BIGLIETTO</h3>
                            <!-- ticket name details -->
                            <div class="col col-md-4">
                                <small>DETTAGLIO PASSEGERI</small>
                                <h4 class="passenger">NOME</h4>
                            </div>
                            <div class="col col-md-8">
                                <!-- ticket train detail and cost -->
                                <table class="table">
                                    <!-- header table -->
                                    <thead>
                                        <tr>
                                            <th>Offerta</th>
                                            <th>Carrozza</th>
                                            <th>Codice CP</th>
                                            <th>Costo Biglietto</th>
                                        </tr>
                                    </thead>
                                    <!-- body table -->
                                    <tbody>
                                        <tr>
                                            <td>-</td>
                                            <td>-</td>
                                            <td>-</td>
                                            <td>-</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- footer -->
    <footer></footer>
    <!-- link js -->
    <script src="./js/script.js"></script>
</body>

</html>
